<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AJEAN</title>
<!-- Thème AVANT rendu (même clé que le portail : jean-theme) pour éviter un flash
     blanc au lancement en mode sombre. Défaut clair, comme app.html. -->
<script>try{var t=localStorage.getItem('jean-theme')||'light';if(t==='dark'||/-dark$/.test(t))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>:root{--bg:#ffffff;--panel:#fafafa;--panel2:#f5f5f5;--border:#e5e5e5;--line2:#d4d4d4;--soft:#f5f5f5;--text:#0a0a0a;
--dim:#6b6b6b;--accent:#0a0a0a;--blue:#0a0a0a;--ok:#0a0a0a;--warn:#6b6b6b;--err:#c0392b;--mag:#6b6b6b}
:root[data-theme="dark"]{--bg:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;--border:#262626;--line2:#333333;--soft:#1c1c1c;
--text:#f5f5f5;--dim:#8e8e8e;--accent:#f5f5f5;--blue:#f5f5f5;--ok:#f5f5f5;--warn:#8e8e8e;--err:#f2777a;--mag:#8e8e8e}
html{background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0}
body.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
.authwrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.card .inner{padding:32px 28px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:0;font-weight:700;font-size:18px;margin-bottom:26px}
.brand .tag{color:var(--accent)}
h1{font-size:18px;font-weight:600;color:var(--accent);margin-bottom:8px}
p{color:var(--dim);font-size:13px;line-height:1.5}
.inner h1,.inner p:first-of-type{text-align:left}
form{margin-top:20px;display:flex;flex-direction:column;gap:10px}
input{padding:11px 13px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:14px;font-weight:600;
  padding:11px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.1);color:#fff}
.err{color:var(--err);margin-top:10px;font-size:13px}
.foot{font-size:12px;color:var(--dim);margin-top:18px;line-height:1.7}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:.9em;border:1px solid var(--border)}
@media (hover:none) and (pointer:coarse){input{font-size:16px}}

/* --- Habillage sobre (même charte que ajean.app et le thème de l'app) --- */
.card{border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
/* Logo en pixels : hauteur multiple de 5 (la grille fait 5 modules de haut) ;
   viewBox élargi d'un module, sinon la dernière colonne du N est rognée. */
.brand svg{height:15px;width:auto;display:block;shape-rendering:crispEdges;fill:var(--text)}
.brand .tag{color:var(--dim);font-weight:400;font-size:15px;line-height:1;position:relative;top:2px}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
input{border:1px solid var(--border);border-radius:10px;background:var(--panel)}
input:focus{border-color:var(--dim)}
.btn{border:1px solid var(--border);border-radius:10px;font-weight:500;font-size:15px;transition:opacity .12s,background .12s,border-color .12s}
.btn:hover{border-color:var(--text)}
/* Fond = accent : le texte prend la couleur du FOND, pas un blanc en dur. */
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn-primary:hover{opacity:.82;background:var(--accent);color:var(--bg)}
code{border:1px solid var(--border);border-radius:6px;background:var(--panel)}

/* ===== Habillage 2026-10 : même charte que ajean.app et l'app (Inter, fonds
   pleins sans bordure, boutons pilule, Jean en tête). Surcharge les règles
   précédentes ; la logique (ids, formulaires) ne change pas. ===== */
:root{--bg:#f6f6f6;--panel:#ffffff;--panel2:#f2f2f2;--field:#f2f2f2;--border:#e7e7e7;--text:#0a0a0a;--dim:#6b6b6b;--accent:#0a0a0a}
:root[data-theme="dark"]{--bg:#0d0d0e;--panel:#18181a;--panel2:#222225;--field:#222225;--border:#2a2a2d;--text:#f5f5f5;--dim:#8e8e93;--accent:#f5f5f5}
html,body.auth{background:var(--bg)}
body.auth{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px}
.authwrap{max-width:420px}
.brand{margin-bottom:22px}
.brand svg{height:15px;width:auto;display:block;shape-rendering:crispEdges;fill:var(--text)}
.brand .tag{color:var(--dim);font-weight:400;font-size:15px;line-height:1;position:relative;top:2px}
.jean{width:64px;height:64px;margin:0 auto -30px;position:relative;z-index:2;display:block;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.18));animation:jhop 3.2s ease-in-out infinite}
.jean .jb{fill:var(--text)}.jean .je{fill:var(--panel)}.jean .js{fill:var(--panel)}
.jean .jf{fill:none;stroke:var(--panel);stroke-width:2.2;stroke-linecap:round}
@keyframes jhop{0%,88%,100%{transform:none}93%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.jean{animation:none}}
.card{max-width:420px;background:var(--panel);border:0;border-radius:24px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.03)}
:root[data-theme="dark"] .card{box-shadow:0 30px 70px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04)}
.card .inner{padding:46px 30px 30px}
h1{font-size:23px;font-weight:650;letter-spacing:-.02em;color:var(--text);margin-bottom:8px}
.inner h1,.inner p:first-of-type{text-align:center}
p{font-size:14px;color:var(--dim)}
.price{color:var(--text);font-weight:600}
form{margin-top:24px;gap:10px}
input{padding:13px 16px;border:0;border-radius:14px;background:var(--field);color:var(--text);font-size:15px;
  transition:box-shadow .15s,background .15s}
input::placeholder{color:var(--dim)}
input:focus{outline:none;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--text)}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:500;font-size:15px;background:var(--panel2);color:var(--text);
  transition:opacity .15s,transform .15s}
.btn:hover{border:0;color:var(--text);opacity:.86}
.btn:active{transform:scale(.98)}
.btn-primary,.btn-primary:hover{background:var(--text);color:var(--panel)}
.btn-primary{margin-top:6px}
.err{background:rgba(192,57,43,.08);color:var(--err);border-radius:12px;padding:10px 12px;font-size:13.5px}
.foot{font-size:13.5px;margin-top:22px}
a{color:var(--text);font-weight:500}
a:hover{text-decoration:none;opacity:.7}
.tabs{background:var(--field);border-radius:999px;padding:4px;gap:4px}
.tab{border:0;border-radius:999px;background:transparent;padding:8px;font-weight:500}
.tab.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.host{border:0;border-radius:999px;background:var(--field);padding:5px 12px}
code{border:0;border-radius:6px;background:var(--field)}
@media (hover:none) and (pointer:coarse){input{font-size:16px}}
</style></head><body class="auth">
<div class="authwrap">
  <div class="brand"><svg viewBox="0 0 23 5" shape-rendering="crispEdges" fill="currentColor" role="img" aria-label="AJEAN"><rect x="1" y="0" width="2" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="0" y="2" width="4" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="8" y="0" width="4" height="1"/><rect x="8" y="1" width="1" height="1"/><rect x="8" y="2" width="3" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="8" y="4" width="4" height="1"/><rect x="14" y="0" width="2" height="1"/><rect x="13" y="1" width="1" height="1"/><rect x="16" y="1" width="1" height="1"/><rect x="13" y="2" width="4" height="1"/><rect x="13" y="3" width="1" height="1"/><rect x="16" y="3" width="1" height="1"/><rect x="13" y="4" width="1" height="1"/><rect x="16" y="4" width="1" height="1"/><rect x="18" y="0" width="1" height="1"/><rect x="21" y="0" width="1" height="1"/><rect x="18" y="1" width="2" height="1"/><rect x="21" y="1" width="1" height="1"/><rect x="18" y="2" width="1" height="1"/><rect x="20" y="2" width="2" height="1"/><rect x="18" y="3" width="1" height="1"/><rect x="21" y="3" width="1" height="1"/><rect x="18" y="4" width="1" height="1"/><rect x="21" y="4" width="1" height="1"/></svg><span class="tag">.link</span></div>
  <svg class="jean" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" class="jb"/><ellipse cx="35" cy="44" rx="3.4" ry="4.6" class="je"/><ellipse cx="65" cy="44" rx="3.4" ry="4.6" class="je"/><circle cx="35" cy="44" r="11.5" class="jf"/><circle cx="65" cy="44" r="11.5" class="jf"/><path d="M46.5 43 Q50 40.5 53.5 43" class="jf"/><path class="js" d="M50 64 C45 60 37 60 32 66 C37 64.5 44 66 50 67.5 C56 66 63 64.5 68 66 C63 60 55 60 50 64 Z"/></svg>
  <div class="card"><div class="inner">
  <h1>Connexion</h1>
  <p>Connectez-vous pour accéder à vos serveurs AJEAN à distance.</p>
  <p class="err" id="jsErr" style="display:none"></p>
  <form id="lf">
    <input type="email" name="email" id="le" placeholder="email" autocomplete="username" autofocus required>
    <input type="password" name="password" id="lp" placeholder="mot de passe" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Se connecter →</button>
  </form>
  <p class="foot">Pas encore de compte ? <a href="/signup.html">Créer un compte</a><br>
    <a href="https://ajean.link/">← Accueil</a></p>
</div></div>
</div>
<script src="/wasm_exec.js"></script>
<script>
// Boîte noire : ce code vient de GitHub Pages (app.ajean.link). Les appels d'auth
// vont au relais (ajean.link) via ce shim, qui ajoute aussi les cookies. Le mot de
// passe ne quitte JAMAIS le navigateur (protocole OPAQUE en WebAssembly).
var API='https://ajean.link';
(function(){var _f=window.fetch.bind(window);
  window.fetch=function(u,opt){
    if(typeof u==='string'&&u.charAt(0)==='/'&&!/^\/(opaque\.wasm|wasm_exec\.js|marked\.min\.js)/.test(u)){
      u=API+u;opt=Object.assign({credentials:'include'},opt||{});
    }
    return _f(u,opt);};})();
// Déjà connecté (cookie valide) ET clé racine E2E (ajk) présente ? On file au
// dashboard. Mais si ajk manque (stockage PWA iOS vidé/évincé), on GARDE le
// formulaire : il faut re-saisir le mot de passe pour re-dériver ajk, sinon on
// boucle « connecté mais clé absente » sans jamais pouvoir sceller l'appairage.
(async function(){try{var r=await fetch('/app/me');
  if(r&&r.ok&&localStorage.getItem('ajk'))location.replace('/');}catch(e){}})();
function jpost(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
var _wasm=(function(){var go=new Go();return WebAssembly.instantiateStreaming(fetch('/opaque.wasm'),go.importObject)
  .then(function(res){go.run(res.instance);});})();
var lf=document.getElementById('lf');
lf.onsubmit=async function(e){e.preventDefault();
  var email=document.getElementById('le').value.trim(),pw=document.getElementById('lp').value;
  var er=document.getElementById('jsErr');er.style.display='none';
  function show(m){er.textContent=m;er.style.display='';}
  try{await _wasm;
    // 1) Tente un login OPAQUE.
    var i1=opaqueLoginInit(pw);if(!i1.ok)throw new Error(i1.err);
    var s1=await jpost('/auth/login/init',{email:email,ke1:i1.ke1});
    if(s1.needLegacy){
      // 2) Compte encore en bcrypt → bascule unique vers OPAQUE.
      var lr=await fetch('/login',{method:'POST',headers:{'X-Ajax':'1','Content-Type':'application/x-www-form-urlencoded'},
        body:'email='+encodeURIComponent(email)+'&password='+encodeURIComponent(pw)});
      var lj={};try{lj=await lr.json();}catch(_){}
      if(!lr.ok||!lj.ok){show((lj&&lj.err)||'Connexion impossible.');return;}
      var ek=await opaqueRegisterFlow(pw);if(!ek){show('Échec de la migration du chiffrement.');return;}
      localStorage.setItem('ajk',ek);location.href='/';return;}
    if(!s1.ok){show(s1.err||'Connexion impossible.');return;}
    var f1=opaqueLoginFinish(s1.ke2,s1.clientID,s1.serverID);
    if(!f1.ok){show('Email ou mot de passe incorrect.');return;}
    var s2=await jpost('/auth/login/finish',{sid:s1.sid,ke3:f1.ke3});
    if(!s2.ok){show(s2.err||'Email ou mot de passe incorrect.');return;}
    localStorage.setItem('ajk',f1.exportKey); // exportKey complète (base64) ; tronquée à 32o à l'import
    location.href='/';
  }catch(err){show('Erreur : '+err);}
};
// Enregistrement OPAQUE (création/migration) → retourne l'exportKey (base64).
async function opaqueRegisterFlow(pw){
  var ri=opaqueRegInit(pw);if(!ri.ok)return null;
  var rr=await jpost('/auth/register/init',{req:ri.req});if(!rr.ok)return null;
  var rf=opaqueRegFinish(rr.response,rr.clientID,rr.serverID);if(!rf.ok)return null;
  var done=await jpost('/auth/register/finish',{record:rf.record});if(!done.ok)return null;
  return rf.exportKey;}
</script>
