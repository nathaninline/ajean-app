<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ajean.link</title>
<style>html,body{height:100%;margin:0;background:#0d1117}
#l{position:fixed;inset:0;display:grid;place-items:center;color:#7d8590;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}</style>
</head><body>
<div id="l">ajean<span style="color:#58a6ff">.link</span></div>
<script>
// BOOTSTRAP anti-cache. Ce fichier est servi à la RACINE et reste donc en cache CDN
// jusqu'à 10 min — mais il ne change (presque) jamais, donc ce cache est inoffensif.
// Toute l'appli vit dans app.html, chargé sous une URL VERSIONNÉE (?v=<build>) : le
// CDN sert alors la bonne version dès le déploiement (même principe que server.html).
// Le numéro de build est lu dans version.json avec une requête au query unique →
// le CDN ne peut jamais resservir un ancien numéro.
(async function(){
  var v='';
  try{
    var r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok)v=(await r.json()).build||'';
  }catch(e){}
  if(!v)v=Date.now();                       // repli : au pire on ne cache pas
  var q=location.search||'';                // conserve ?sub=ok etc.
  location.replace('/app.html?v='+encodeURIComponent(v)+(q?('&'+q.slice(1)):''));
})();
</script>
</body></html>
