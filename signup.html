<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><rect width='12' height='12' rx='2' ry='2' fill='%231f6feb'/><rect x='6' y='3' width='2' height='2' fill='%23fff'/><rect x='6' y='5' width='2' height='2' fill='%23fff'/><rect x='4' y='7' width='2' height='2' fill='%23fff'/></svg>">
<title>Jean</title>
<style>:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c222b;--border:#30363d;--text:#e6edf3;
--dim:#7d8590;--accent:#58a6ff;--blue:#1f6feb;--ok:#58a6ff;--warn:#d29922;--err:#f85149;--mag:#bc8cff}
*{box-sizing:border-box;margin:0;padding:0}
body.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;background:var(--bg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.authwrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.card .inner{padding:32px 28px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:26px}
.brand .tag{color:var(--accent)}
h1{font-size:18px;font-weight:600;color:var(--accent);margin-bottom:8px}
p{color:var(--dim);font-size:13px;line-height:1.5}
.inner h1,.inner p:first-of-type{text-align:left}
.price{color:var(--text);font-weight:600;margin-top:6px}
form{margin-top:20px;display:flex;flex-direction:column;gap:10px}
input{padding:11px 13px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:14px;font-weight:600;
  padding:11px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.1);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.err{color:var(--err);margin-top:10px;font-size:13px}
.foot{font-size:12px;color:var(--dim);margin-top:18px;line-height:1.7}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
@media (hover:none) and (pointer:coarse){input{font-size:16px}}
</style></head><body class="auth">
<div class="authwrap">
  <div class="brand"><span>ajean<span class="tag">.link</span></span></div>
  <div class="card"><div class="inner">
  <h1>Créer un compte gratuit</h1>
  <p>Accès distant chiffré de bout en bout à tes serveurs Jean.</p>
  <p class="err" id="jsErr" style="display:none"></p>
  <form id="sf">
    <input type="email" name="email" id="se" placeholder="email" autocomplete="username" autofocus required>
    <input type="password" name="password" id="sp" placeholder="mot de passe (min. 8 caractères)" autocomplete="new-password" minlength="8" required>
    <input type="password" name="password2" id="sp2" placeholder="confirmer le mot de passe" autocomplete="new-password" minlength="8" required>
    <button class="btn btn-primary" id="sb" type="submit">Créer mon compte gratuit →</button>
  </form>
  <p class="foot">Déjà un compte ? <a href="/login.html">Se connecter</a> · <a href="https://ajean.link/">← Accueil</a></p>
</div></div>
</div>
<script src="/wasm_exec.js"></script>
<script>
// Boîte noire : code servi par GitHub Pages ; les appels d'auth/paiement vont au
// relais (ajean.link) via ce shim, avec cookies. Mot de passe = OPAQUE (WASM).
var API='https://ajean.link';
(function(){var _f=window.fetch.bind(window);
  window.fetch=function(u,opt){
    if(typeof u==='string'&&u.charAt(0)==='/'&&!/^\/(opaque\.wasm|wasm_exec\.js|marked\.min\.js|e2e\.js)/.test(u)){
      u=API+u;opt=Object.assign({credentials:'include'},opt||{});
    }
    return _f(u,opt);};})();
function jpost(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
var _wasm=(function(){var go=new Go();return WebAssembly.instantiateStreaming(fetch('/opaque.wasm'),go.importObject)
  .then(function(res){go.run(res.instance);});})();
// Enregistrement OPAQUE → retourne l'exportKey (base64) ; le compte est déjà en session.
async function opaqueRegisterFlow(pw){
  var ri=opaqueRegInit(pw);if(!ri.ok)return null;
  var rr=await jpost('/auth/register/init',{req:ri.req});if(!rr.ok)return null;
  var rf=opaqueRegFinish(rr.response,rr.clientID,rr.serverID);if(!rf.ok)return null;
  var done=await jpost('/auth/register/finish',{record:rf.record});if(!done.ok)return null;
  return rf.exportKey;}
var sf=document.getElementById('sf');
sf.onsubmit=async function(e){e.preventDefault();
  var email=document.getElementById('se').value.trim(),pw=document.getElementById('sp').value,pw2=document.getElementById('sp2').value;
  var er=document.getElementById('jsErr'),b=document.getElementById('sb');
  function show(m){er.textContent=m;er.style.display='';b.disabled=false;b.textContent='Créer mon compte gratuit →';}
  er.style.display='none';
  if(pw.length<8){show('Le mot de passe doit faire au moins 8 caractères.');return;}
  if(pw!==pw2){show('Les deux mots de passe ne correspondent pas.');return;}
  b.disabled=true;b.textContent='Création…';
  try{await _wasm;
    // 1) Crée le compte (en attente d'abonnement) + ouvre la session.
    var su=await jpost('/auth/signup',{email:email});
    if(!su.ok){show(su.err||'Inscription impossible.');return;}
    // 2) Enregistre le mot de passe (OPAQUE) sur ce compte.
    var ek=await opaqueRegisterFlow(pw);
    if(!ek){show('Échec de l\'enregistrement du mot de passe.');return;}
    localStorage.setItem('ajk',ek);
    // 3) Compte gratuit prêt : direction le tableau de bord (connexion d'un serveur).
    //    L'abonnement illimité se fait plus tard, depuis le tableau de bord.
    b.textContent='Compte créé, redirection…';
    location.href='/';
  }catch(err){show('Erreur : '+err);}
};
</script>
</body></html>
